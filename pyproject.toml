[project]
name = "company-ai-agent"
version = "0.1.0"
description = "Local-first company and product knowledge agent"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.118,<1",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "numpy>=2.0,<3",
  "openpyxl>=3.1,<4",
  "pillow>=11,<13",
  "pydantic-settings>=2.7,<3",
  "pymupdf>=1.26,<2",
  "pypdf>=6,<7",
  "PyYAML>=6,<7",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35,<1",
  "xlrd>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.26,<1",
  "ruff>=0.11,<1",
  "types-openpyxl>=3.1,<4",
  "types-PyYAML>=6,<7",
  "types-xlrd>=2.0,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/company_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["company_agent"]
