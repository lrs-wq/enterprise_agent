location = /company-ai {
    return 301 /company-ai/;
}

location = /company-ai/api/chat {
    client_max_body_size 64k;

    proxy_pass http://127.0.0.1:18000/api/chat;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /company-ai;
    proxy_connect_timeout 10s;
    # The app stops chat work at 75s; the proxy allows a small margin for JSON delivery.
    proxy_read_timeout 85s;
    proxy_send_timeout 15s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
}

location = /company-ai/api/chat/stream {
    client_max_body_size 64k;

    proxy_pass http://127.0.0.1:18000/api/chat/stream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /company-ai;
    proxy_connect_timeout 10s;
    proxy_read_timeout 85s;
    proxy_send_timeout 15s;
    proxy_buffering off;
    proxy_cache off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
}

location ^~ /company-ai/ {
    client_max_body_size 100m;

    proxy_pass http://127.0.0.1:18000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /company-ai;
    proxy_connect_timeout 10s;
    # Admin parsing tasks stop at 280s by default.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
}
