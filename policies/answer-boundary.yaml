    title: 请说明养护对象
    summary: 请说明您想了解的是哪种宠物或犬猫品种，我可以介绍非诊疗性的日常养护注意事项。
    reason: 当前问法无法可靠确认养护对象是否为宠物。
  mixed_medical:
    title: 可回答独立的产品问题
    summary: "宠物健康异常需要由兽医结合实际情况判断；以下仅回答同一问题中独立的本公司产品或公司信息。"
    reason: "我不能进行疾病诊断或提供治疗、用药方案；如症状持续或加重，请尽快联系执业兽医。"
  mixed_third_party:
    title: 仅介绍自有产品
    summary: "{third_party}并非本公司或旗下自有品牌产品，因此我们不对{third_party}作评价或比较。以下仅依据已审核资料介绍本公司自有产品。"
    reason: "{third_party}不属于本公司自有产品，其产品资料未经过本公司知识库的审核与发布，无法保证评价的准确性和公正性。"
  other_company:
    title: 仅介绍自有产品
    summary: "{third_party}并非本公司或旗下自有品牌产品，因此我们不对{third_party}进行介绍、推荐、评价或比较。我可以继续介绍本公司的自有品牌和产品。"
    reason: "{third_party}不属于本公司自有产品，其产品资料未经过本公司知识库的审核与发布，无法保证评价的准确性和公正性。"
  medical:
    title: 需要专业兽医判断
    summary: 我不能进行宠物疾病诊断，也不能提供药物、剂量或治疗方案。请联系执业兽医，并向其说明宠物的症状、持续时间和基础情况。
    reason: 宠物疾病诊断、用药、剂量与治疗属于专业兽医医疗范畴，仅凭在线描述无法安全判断。
  emergency:
    title: 请立即联系宠物急诊
    summary: 这可能属于紧急情况，请立即联系附近的宠物医院或宠物急诊，并按接诊兽医的指引处理。我不能远程提供诊断、用药或处置步骤。
    reason: 问题描述可能涉及危及生命的急症，远程建议可能延误诊治，必须由执业兽医立即检查。
  private_information:
    title: 无法提供未公开信息
    summary: 我只能依据已审核并公开发布的公司资料回答，不能披露内部成本、个人信息或其他未公开经营信息。
    reason: 请求涉及未公开经营信息、凭据或个人信息，不在已授权的公开知识范围内。
  unrelated:
    title: 超出服务范围
    summary: 我可以介绍公司、自有品牌与产品，也可以使用本地模型的通用知识回答非诊疗性的日常养宠问题；这个问题不在当前服务范围内。
    reason: 该问题不属于公司介绍、自有产品或非诊疗性日常养宠知识范围。
  clarification_product:
    title: 请补充产品信息
    summary: 请提供产品品牌、完整名称或型号；在无法确认产品归属和具体型号时，我不会推测功能或使用方法。
    reason: 当前问题缺少可验证的品牌、产品名或型号，无法确定应该使用哪份已审核资料。
  clarification_subject:
    title: 请确认查询主体
    summary: 请说明你指的是本公司或旗下品牌，还是其他公司或品牌，并提供准确名称。我不会将未确认的主体默认为本公司。
    reason: 当前问题中的公司或品牌主体尚未确认，需要先明确归属才能选择正确的回答边界。
  personalized_feeding:
    title: 需要更多喂养信息
    summary: 不能只凭宠物体重给出精确喂食克数。请先参考所用食品包装的喂食指南，并结合年龄、体况、活动量及兽医建议；如需继续，请补充食品名称、宠物年龄和体况。
    reason: 精确喂食量同时受食品热量、年龄、体况和活动量影响，仅凭体重无法给出安全数值。
  conversational:
    title: 公司智能助手
    summary: 你好！我可以介绍无锡狗哥里啦电子商务有限公司及旗下品牌和产品，也可以使用本地模型通用知识回答非诊疗性的日常养宠问题。
  service_unavailable:
    title: 本地模型暂时不可用
    summary: 当前无法连接本地模型服务，请稍后重试或联系管理员检查 Ollama 运行状态。
    reason: 本地生成或向量模型当前无法连接，因此系统不能在本次请求中生成或验证答案。
